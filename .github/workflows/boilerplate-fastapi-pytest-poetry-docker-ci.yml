name: CI Pipeline - Unigalactix/boilerplate-fastapi-pytest-poetry-docker
on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]
env:
  CI: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.3
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Install dependencies
        run: poetry install --with dev
      
      - name: Test
        run: poetry run pytest
      
      - name: Notify Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Build and Test job completed successfully"
          else
            echo "❌ Build and Test job failed"
          fi


  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      
      - name: Notify Security Scan Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Security scan completed successfully"
          else
            echo "❌ Security scan failed"
          fi


  docker-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase repo name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:latest,${{ secrets.ACR_LOGIN_SERVER }}/${{ env.REPO_LOWER }}:${{ github.sha }}
      
      - name: Notify Docker Build Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Docker build and push completed successfully"
          else
            echo "❌ Docker build and push failed"
          fi


  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, security-scan, docker-build]
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'mvdemoapp'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          slot-name: production
      
      - name: Notify Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment completed successfully"
          else
            echo "❌ Deployment failed"
          fi

  # Pipeline Health Monitoring Job
  monitor-pipeline:
    if: always()
    runs-on: ubuntu-latest
    needs: [build, security-scan, docker-build, deploy]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check Pipeline Status
        id: status
        run: |
          BUILD_STATUS="${{ needs.build.result }}"
          SECURITY_STATUS="${{ needs.security-scan.result }}"
          DOCKER_STATUS="${{ needs.docker-build.result }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"
          
          echo "build_status=$BUILD_STATUS" >> $GITHUB_OUTPUT
          echo "security_status=$SECURITY_STATUS" >> $GITHUB_OUTPUT
          echo "docker_status=$DOCKER_STATUS" >> $GITHUB_OUTPUT
          echo "deploy_status=$DEPLOY_STATUS" >> $GITHUB_OUTPUT
          
          # Determine overall status - fail if any required job failed or was cancelled
          if [[ "$BUILD_STATUS" == "failure" ]] || [[ "$BUILD_STATUS" == "cancelled" ]] || \
             [[ "$SECURITY_STATUS" == "failure" ]] || [[ "$SECURITY_STATUS" == "cancelled" ]] || \
             [[ "$DOCKER_STATUS" == "failure" ]] || [[ "$DOCKER_STATUS" == "cancelled" ]] || \
             [[ "$DEPLOY_STATUS" == "failure" ]] || [[ "$DEPLOY_STATUS" == "cancelled" ]]; then
            echo "overall_status=failure" >> $GITHUB_OUTPUT
          else
            echo "overall_status=success" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate Pipeline Report
        run: |
          echo "## 📊 CI/CD Pipeline Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Build status
          if [ "${{ steps.status.outputs.build_status }}" == "success" ]; then
            echo "✅ **Build & Test:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.status.outputs.build_status }}" == "skipped" ]; then
            echo "⏭️ **Build & Test:** Skipped" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.status.outputs.build_status }}" == "cancelled" ]; then
            echo "🚫 **Build & Test:** Cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build & Test:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security status
          if [ "${{ steps.status.outputs.security_status }}" == "success" ]; then
            echo "✅ **Security Scan:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.status.outputs.security_status }}" == "skipped" ]; then
            echo "⏭️ **Security Scan:** Skipped" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.status.outputs.security_status }}" == "cancelled" ]; then
            echo "🚫 **Security Scan:** Cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security Scan:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Docker status
          if [ "${{ steps.status.outputs.docker_status }}" == "success" ]; then
            echo "✅ **Docker Build:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.status.outputs.docker_status }}" == "skipped" ]; then
            echo "⏭️ **Docker Build:** Skipped" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.status.outputs.docker_status }}" == "cancelled" ]; then
            echo "🚫 **Docker Build:** Cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Docker Build:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Deploy status
          if [ "${{ steps.status.outputs.deploy_status }}" == "success" ]; then
            echo "✅ **Deployment:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.status.outputs.deploy_status }}" == "skipped" ]; then
            echo "⏭️ **Deployment:** Skipped" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.status.outputs.deploy_status }}" == "cancelled" ]; then
            echo "🚫 **Deployment:** Cancelled" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.status.outputs.overall_status }}" == "success" ]; then
            echo "### 🎉 Overall Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚨 Overall Status: FAILURE" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Notify on Failure
        if: steps.status.outputs.overall_status == 'failure'
        run: |
          echo "🚨 CI/CD Pipeline Failed!"
          echo "Pipeline run ${{ github.run_number }} has failed."
          echo "Please check the logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "Failed Jobs:"
          if [ "${{ steps.status.outputs.build_status }}" == "failure" ] || [ "${{ steps.status.outputs.build_status }}" == "cancelled" ]; then
            echo "  - Build & Test (${{ steps.status.outputs.build_status }})"
          fi
          if [ "${{ steps.status.outputs.security_status }}" == "failure" ] || [ "${{ steps.status.outputs.security_status }}" == "cancelled" ]; then
            echo "  - Security Scan (${{ steps.status.outputs.security_status }})"
          fi
          if [ "${{ steps.status.outputs.docker_status }}" == "failure" ] || [ "${{ steps.status.outputs.docker_status }}" == "cancelled" ]; then
            echo "  - Docker Build (${{ steps.status.outputs.docker_status }})"
          fi
          if [ "${{ steps.status.outputs.deploy_status }}" == "failure" ] || [ "${{ steps.status.outputs.deploy_status }}" == "cancelled" ]; then
            echo "  - Deployment (${{ steps.status.outputs.deploy_status }})"
          fi
      
      - name: Success Rate Tracking
        if: always()
        run: |
          echo "📈 Pipeline Success Rate Tracking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This run: ${{ steps.status.outputs.overall_status }}" >> $GITHUB_STEP_SUMMARY
          echo "Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "Run Number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 **Tip:** Track success rates using GitHub Actions insights at:" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.server_url }}/${{ github.repository }}/actions" >> $GITHUB_STEP_SUMMARY